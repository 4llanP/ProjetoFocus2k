<!DOCTYPE html>
<html lang="pt-BR" style="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus 2k - Login Acessível (Baixa Visão &amp; TDAH)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Space Grotesk"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            surface: {
              main: '#080808',
              card: '#111113',
              cardHover: '#161619',
              input: '#0c0c0e',
              border: '#242429',
              borderFocus: '#fffff2'
            },
            ivory: {
              DEFAULT: '#fffff2',
              muted: '#b5b5ba',
              dim: '#75757d'
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #080808;
      color: #fffff2;
      
      font-family: 'Space Grotesk', sans-serif;
      letter-spacing: -0.01em;
    }
    .custom-focus:focus-within {
      border-color: #fffff2;
      box-shadow: 0 0 0 2px rgba(255, 255, 242, 0.25);
    }
    .glow-card {
      box-shadow: 0 12px 40px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px #222226;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#fffff2] selection:text-[#080808]" style="font-size: 1rem;">

  <!-- Container Central de Autenticação -->
  <main class="flex-1 flex items-center justify-center px-4 py-8">
    <div id="authCardWrapper" class="w-full transition-all duration-200 max-w-md">

      <!-- Card Principal -->
      <div class="bg-[#111113] border border-[#222226] rounded-2xl p-6 sm:p-8 glow-card">

        <!-- Tabs Acessíveis com Alto Contraste -->
        <div class="flex border-b border-[#222226] mb-6 gap-2">
          <button id="tabLogin" onclick="mudarAba('login')" class="flex-1 pb-3 text-sm sm:text-base font-bold text-[#fffff2] border-b-2 border-[#fffff2] text-center transition flex items-center justify-center gap-2">
            <span class="">●</span>
            <span class="">Entrar na Conta</span>
          </button>
          <button id="tabCadastro" onclick="mudarAba('cadastro')" class="flex-1 pb-3 text-sm sm:text-base font-medium text-[#75757d] hover:text-[#d6d6de] border-b-2 border-transparent text-center transition flex items-center justify-center gap-2">
            <span class="">○</span>
            <span class="">Criar Acesso</span>
          </button>
        </div>

        <!-- Mensagens de Alerta Dinâmicas -->
        <div id="statusAlert" class="mb-5 p-3.5 rounded-xl text-xs font-semibold border flex items-center gap-2.5 bg-[#18181c] border-[#333338] text-[#fffff2] hidden">
          <span id="alertIcon" class="">ℹ️</span>
          <span id="alertMessage" class="">Instruções de recuperação foram enviadas para seu e-mail cadastrado.</span>
        </div>

        <!-- FORMULÁRIO: LOGIN -->
        <form id="formLogin" onsubmit="event.preventDefault(); executarLogin();" class="space-y-4">
          <!-- Campo E-mail -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-baseline">
              <label for="loginUser" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">
                E-mail de Acesso
              </label>
            </div>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] transition">
              <input type="email" id="loginUser" placeholder="Ex: aluno@focus2k.com" autocomplete="email" class="w-full bg-transparent px-3.5 py-3 text-sm sm:text-base text-[#fffff2] placeholder-[#5c5c64] outline-none font-medium">
            </div><div class="flex justify-end pt-1"><span class="text-[11px] text-[#b5b5ba] hover:text-[#fffff2] underline transition">* Campo obrigatório</span></div>
          </div>

          <!-- Campo Senha -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-baseline"><label for="loginPassword" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">Sua Senha</label></div>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] flex items-center pr-2 transition">
              <input type="password" id="loginPassword" placeholder="••••••••••••" autocomplete="current-password" class="w-full bg-transparent px-3.5 py-3 text-sm sm:text-base text-[#fffff2] placeholder-[#5c5c64] outline-none font-medium">
              <button type="button" onclick="alternarVisibilidadeSenha('loginPassword', 'iconToggleSenha')" class="p-2 text-xs font-mono text-[#b5b5ba] hover:text-[#fffff2] border border-[#242429] rounded-lg bg-[#141417] transition flex items-center gap-1" aria-label="Mostrar ou ocultar senha"><svg id="iconToggleSenha" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button>
            </div><div class="flex justify-end pt-1"><button type="button" onclick="mostrarDicaSenha()" class="text-[11px] text-[#b5b5ba] hover:text-[#fffff2] underline transition">Esqueceu a senha?</button></div>
          </div>

          <!-- Opções de Conforto: Lembrar Sessão -->
          <div class="pt-1 flex items-center justify-between text-xs">
            <label class="flex items-center gap-2.5 cursor-pointer text-[#d6d6de]">
              <input type="checkbox" id="chkLembrar" checked="" class="w-4 h-4 rounded border-2 border-[#3c3c44] bg-[#0a0a0c] accent-[#fffff2] text-[#080808] cursor-pointer">
              <span class="select-none font-medium">Manter conectado neste navegador</span>
            </label>
          </div>

          <!-- Botão Primário: Entrar no Focus 2k -->
          <button type="submit" class="w-full mt-3 py-3.5 px-4 bg-[#fffff2] hover:bg-white text-[#080808] font-bold text-sm sm:text-base rounded-xl transition transform active:scale-[0.99] shadow-lg flex items-center justify-center gap-2">
            <span class="">Entrar no Focus 2k</span>
            <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
            </svg>
          </button>
        </form>

        <!-- FORMULÁRIO: CADASTRO -->
        <form id="formCadastro" onsubmit="event.preventDefault(); executarCadastro();" class="space-y-4 hidden">
          <!-- Nome -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-baseline">
              <label for="cadNome" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">
                Nome Completo
              </label>
              <span class="text-[10px] text-[#8e8e96] font-mono">Mínimo 3 caracteres</span>
            </div>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] transition">
              <input type="text" id="cadNome" placeholder="Ex: Maria Estudante" class="w-full bg-transparent px-3.5 py-3 text-sm sm:text-base text-[#fffff2] placeholder-[#5c5c64] outline-none font-medium">
            </div>
          </div>

          <!-- E-mail Cadastro -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-baseline">
              <label for="cadEmail" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">
                E-mail
              </label>
              <span class="text-[10px] text-[#8e8e96] font-mono">Obrigatório para login</span>
            </div>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] transition">
              <input type="email" id="cadEmail" placeholder="Ex: aluno@focus2k.com" class="w-full bg-transparent px-3.5 py-3 text-sm sm:text-base text-[#fffff2] placeholder-[#5c5c64] outline-none font-medium">
            </div>
          </div>

          <!-- Senha Cadastro -->
          <div class="space-y-1.5">
            <label for="cadSenha" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">
              Crie uma Senha
            </label>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] transition">
              <input type="password" id="cadSenha" placeholder="Mínimo 4 caracteres" class="w-full bg-transparent px-3.5 py-3 text-sm sm:text-base text-[#fffff2] placeholder-[#5c5c64] outline-none font-medium">
            </div>
          </div>

          <!-- Estilo de Instrução TPAC -->
          <div class="space-y-1.5">
            <div class="flex justify-between items-baseline">
              <label for="cadEstilo" class="block text-xs sm:text-sm font-semibold text-[#fffff2]">
                Perfil de Aprendizagem &amp; IA
              </label>
              <span class="text-[10px] text-[#8e8e96] font-mono">Modo TPAC</span>
            </div>
            <div class="relative custom-focus rounded-xl border-2 border-[#26262c] bg-[#0a0a0c] transition">
              <select id="cadEstilo" class="w-full bg-[#0a0a0c] px-3.5 py-3 text-sm text-[#fffff2] outline-none font-medium cursor-pointer rounded-xl">
                <option value="detalhado">Detalhado (Passo a passo calmo e contextual)</option>
                <option value="direto">Direto (Sintético, objetivo e sem rodeios)</option>
              </select>
            </div>
            <p class="text-[11px] text-[#8e8e96]">Configura as respostas do assistente para seu ritmo cognitivo.</p>
          </div>

          <!-- Botão Primário: Criar Conta -->
          <button type="submit" class="w-full mt-3 py-3.5 px-4 bg-[#fffff2] hover:bg-white text-[#080808] font-bold text-sm sm:text-base rounded-xl transition transform active:scale-[0.99] shadow-lg flex items-center justify-center gap-2">
            <span class="">Finalizar Cadastro e Entrar</span>
            <svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
            </svg>
          </button>
        </form>

        <!-- Divisor com métodos rápidos de acesso -->
        <div class="my-6 flex items-center gap-3">
          <div class="flex-1 h-[1px] bg-[#222226]"></div>
          <span class="text-[11px] font-mono text-[#75757d] uppercase tracking-wider">Acesso Institucional</span>
          <div class="flex-1 h-[1px] bg-[#222226]"></div>
        </div>

        <!-- Acesso rápido SSO / Google Acadêmico -->
        <button type="button" onclick="loginDemoInstitucional()" class="w-full py-2.5 px-3 rounded-xl border border-[#2b2b33] hover:border-[#fffff2] bg-[#141417] text-xs font-semibold text-[#d6d6de] hover:text-[#fffff2] transition flex items-center justify-center gap-2 mb-3">
          <span class="">Entrar com Login Acadêmico / SSO</span>
        </button>

        <!-- Atalho para Teste de Dashboard -->
        <a href="dashboard.html" class="w-full py-2.5 px-3 rounded-xl border border-dashed border-[#333338] hover:border-[#fffff2] bg-[#0c0c0e] text-xs font-mono text-[#75757d] hover:text-[#fffff2] transition flex items-center justify-center gap-2">
          <span>🚀 Ir direto para o Dashboard (Teste)</span>
        </a>

      </div>

    </div>
  </main>

  <!-- Rodapé Global -->
  <footer class="w-full border-t border-[#1a1a1d] px-6 py-3 flex flex-wrap items-center justify-between text-xs text-[#75757d] font-mono">
    <div class="flex items-center gap-4">
    </div>
  </footer>

  <!-- Interações Acessíveis em Vanilla JS com Integração API -->
  <script>
    const API_URL = "";

    function validarEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    function mudarAba(aba) {
      const formLog = document.getElementById('formLogin');
      const formCad = document.getElementById('formCadastro');
      const tabLog = document.getElementById('tabLogin');
      const tabCad = document.getElementById('tabCadastro');
      esconderAlerta();

      if (aba === 'login') {
        formLog.classList.remove('hidden');
        formCad.classList.add('hidden');
        tabLog.className = 'flex-1 pb-3 text-sm sm:text-base font-bold text-[#fffff2] border-b-2 border-[#fffff2] text-center transition flex items-center justify-center gap-2';
        tabCad.className = 'flex-1 pb-3 text-sm sm:text-base font-medium text-[#75757d] hover:text-[#d6d6de] border-b-2 border-transparent text-center transition flex items-center justify-center gap-2';
        document.getElementById('loginUser').focus();
      } else {
        formLog.classList.add('hidden');
        formCad.classList.remove('hidden');
        tabCad.className = 'flex-1 pb-3 text-sm sm:text-base font-bold text-[#fffff2] border-b-2 border-[#fffff2] text-center transition flex items-center justify-center gap-2';
        tabLog.className = 'flex-1 pb-3 text-sm sm:text-base font-medium text-[#75757d] hover:text-[#d6d6de] border-b-2 border-transparent text-center transition flex items-center justify-center gap-2';
        document.getElementById('cadNome').focus();
      }
    }

    function alternarVisibilidadeSenha(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🔒';
      } else {
        input.type = 'password';
        icon.textContent = '👁️';
      }
    }

    function mostrarAlerta(msg, tipo) {
      const alert = document.getElementById('statusAlert');
      const icon = document.getElementById('alertIcon');
      const text = document.getElementById('alertMessage');

      alert.classList.remove('hidden', 'bg-rose-950/70', 'border-rose-500/80', 'text-rose-200', 'bg-emerald-950/70', 'border-emerald-500/80', 'text-emerald-200', 'bg-[#18181c]', 'border-[#333338]', 'text-[#fffff2]');

      if (tipo === 'erro') {
        alert.classList.add('bg-rose-950/70', 'border-rose-500/80', 'text-rose-200');
        icon.textContent = '⚠️';
      } else if (tipo === 'sucesso') {
        alert.classList.add('bg-emerald-950/70', 'border-emerald-500/80', 'text-emerald-200');
        icon.textContent = '✓';
      } else {
        alert.classList.add('bg-[#18181c]', 'border-[#333338]', 'text-[#fffff2]');
        icon.textContent = 'ℹ️';
      }

      text.textContent = msg;
    }

    function esconderAlerta() {
      document.getElementById('statusAlert').classList.add('hidden');
    }

    async function executarLogin() {
      const email = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPassword').value;

      // Validação frontend prévia (segurança/usabilidade)
      if (!email) {
        mostrarAlerta('Por favor, informe seu e-mail para prosseguir.', 'erro');
        document.getElementById('loginUser').focus();
        return;
      }

      if (!validarEmail(email)) {
        mostrarAlerta('Por favor, informe um endereço de e-mail válido.', 'erro');
        document.getElementById('loginUser').focus();
        return;
      }

      if (!pass) {
        mostrarAlerta('Por favor, digite sua senha de acesso.', 'erro');
        document.getElementById('loginPassword').focus();
        return;
      }

      try {
        mostrarAlerta('Autenticando...', 'info');
        const res = await fetch(`${API_URL}/usuarios/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email: email, senha: pass })
        });

        const data = await res.json();

        if (res.ok) {
          const tVal = data.token || data.access_token;
          if (tVal) {
            localStorage.setItem('token', tVal);
          }
          if (data.role) {
            localStorage.setItem('role', data.role);
          }
          mostrarAlerta('Login realizado com sucesso! Redirecionando para o Dashboard...', 'sucesso');
          setTimeout(() => {
            window.location.href = 'dashboard.html?v=' + Date.now();
          }, 1500);
        } else {
          mostrarAlerta(data.detail || 'Credenciais inválidas. Se ainda não tem conta, cadastre-se na aba "Criar Acesso".', 'erro');
        }
      } catch (err) {
        console.error("Erro de conexão no login:", err);
        mostrarAlerta('Não foi possível conectar ao servidor backend em http://localhost:8000. O Uvicorn está rodando?', 'erro');
      }
    }

    async function executarCadastro() {
      const nome = document.getElementById('cadNome').value.trim();
      const email = document.getElementById('cadEmail').value.trim();
      const senha = document.getElementById('cadSenha').value;
      const estilo = document.getElementById('cadEstilo').value;

      // Validação frontend prévia
      if (!nome || nome.length < 3) {
        mostrarAlerta('O nome deve conter ao menos 3 caracteres.', 'erro');
        document.getElementById('cadNome').focus();
        return;
      }

      if (!email || !validarEmail(email)) {
        mostrarAlerta('Por favor, informe um e-mail válido.', 'erro');
        document.getElementById('cadEmail').focus();
        return;
      }

      if (!senha || senha.length < 4) {
        mostrarAlerta('A senha precisa ter no mínimo 4 caracteres.', 'erro');
        document.getElementById('cadSenha').focus();
        return;
      }

      try {
        mostrarAlerta('Criando conta...', 'info');
        const res = await fetch(`${API_URL}/usuarios`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: nome,
            email: email,
            senha: senha,
            estilo_instrucao: estilo
          })
        });

        const data = await res.json();

        if (res.ok) {
          mostrarAlerta('Conta criada com sucesso! Faça login com suas credenciais.', 'sucesso');
          setTimeout(() => {
            mudarAba('login');
            document.getElementById('loginUser').value = email;
            document.getElementById('loginPassword').value = '';
          }, 1400);
        } else {
          mostrarAlerta(data.detail || 'Erro ao criar conta no sistema.', 'erro');
        }
      } catch (err) {
        mostrarAlerta('Não foi possível conectar ao servidor backend.', 'erro');
      }
    }

    function mostrarDicaSenha() {
      mostrarAlerta('Instruções de recuperação foram enviadas para seu e-mail cadastrado.', 'info');
    }

    function loginDemoInstitucional() {
      document.getElementById('loginUser').value = 'aluno.academico@focus2k.edu.br';
      document.getElementById('loginPassword').value = 'senha1234';
      executarLogin();
    }
  </script>

</body>
</html>
